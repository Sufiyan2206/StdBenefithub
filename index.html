<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Benefit Hub</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1d2433;--muted:#667085;--accent:#2f5bea;--soft:#e8eeff;--border:#e1e5ee;--ok:#0f7b4b;--okbg:#e3f6ec;--no:#b42318;--nobg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--text:#e8ebf2;--muted:#9aa3b5;--accent:#7b9bff;--soft:#232b45;--border:#2c3342;--ok:#4cc790;--okbg:#16352a;--no:#ff8b7e;--nobg:#3a1f1c;--warn:#f2c14e;--warnbg:#3a3015}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:860px;margin:0 auto}
.brand{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.brand .ms{grid-column:1;justify-self:start;height:44px;width:auto;max-width:100%;display:block}
.brand .de{grid-column:2;justify-self:end;height:44px;width:auto;display:block}
@media(max-width:480px){.brand .ms{height:30px}.brand .de{height:30px}.brand{padding:10px 12px;gap:8px}}
h1{font-size:1.5rem;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);margin:0 0 20px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-size:.85rem;font-weight:600;margin:0 0 6px;color:var(--muted)}
select{width:100%;padding:12px;font-size:1rem;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)}
select:focus,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.row{grid-template-columns:1fr 1fr}}
@media(min-width:780px){.row{grid-template-columns:repeat(3,1fr)}}
.hidden{display:none}
.branch{font-size:1.15rem;font-weight:600}
.badge{display:inline-block;background:var(--soft);color:var(--accent);padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600;margin:6px 6px 0 0}
.stats{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
@media(min-width:560px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--soft);border-radius:12px;padding:14px 16px}
.stat .k{font-size:.8rem;color:var(--muted);font-weight:600}
.stat .v{font-size:1.9rem;font-weight:700;margin:2px 0}
.stat .n{font-size:.82rem;color:var(--muted)}
h2{font-size:1rem;margin:0 0 12px}
h3{font-size:.95rem;margin:0 0 8px}
.muted{color:var(--muted);font-size:.88rem}
.sched{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.sched{grid-template-columns:repeat(5,1fr)}}
.inst{border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.85rem}
.inst b{display:block;font-size:.95rem}
.inst span{color:var(--muted);font-size:.78rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;border-radius:99px;font-size:.88rem;cursor:pointer;font-family:inherit}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0b1020}}
.rounds{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.rounds{grid-template-columns:1fr 1fr}}
.round{border:1px solid var(--border);border-radius:12px;padding:14px}
.round.live{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.round .t{font-weight:600}
.round .d{color:var(--muted);font-size:.82rem;margin:2px 0 10px}
.live-tag{background:var(--okbg);color:var(--ok);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:.9rem}
.kv:last-of-type{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:99px}
.chip.y{background:var(--okbg);color:var(--ok)}
.chip.n{background:var(--nobg);color:var(--no);text-decoration:line-through;opacity:.8}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
.scroll{overflow-x:auto}
.vtab{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 18px;border-radius:99px;font-size:.92rem;cursor:pointer;font-family:inherit}
.vtab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .vtab[aria-selected="true"]{color:#0b1020}}
.vtab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gl{padding-left:22px;margin:0}.gl li{margin:7px 0;line-height:1.45;font-size:.92rem}.gl ol{margin-top:6px}
.bk th{background:var(--soft);color:var(--text)}.bk td:not(:first-child),.bk th:not(:first-child){text-align:right}
.bk{border:1px solid var(--border)}
.b1 table{table-layout:fixed;width:100%}
.b1 th:nth-child(1){width:9%}.b1 th:nth-child(2){width:21%}.b1 th:nth-child(3){width:24%}
.b1 th,.b1 td{overflow-wrap:anywhere;font-size:.85rem}
.b1 th{white-space:normal;vertical-align:bottom;line-height:1.3}
@media(max-width:640px){
  .b1 table,.b1 tbody{display:block}
  .b1 thead{display:none}
  .b1 tr{display:block;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:6px 12px}
  .b1 td{display:block;border:0;padding:5px 0}
  .b1 td::before{content:attr(data-label);display:block;font-size:.72rem;color:var(--muted);font-weight:600}
}
.spills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.spill{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 16px;border-radius:99px;font-size:.9rem;cursor:pointer;font-family:inherit}
.spill[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .spill[aria-pressed="true"]{color:#0b1020}}
.spill:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pbtn{width:100%;padding:12px;font-size:1rem;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit;font-weight:600}
.pbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pbtn[aria-pressed="true"]{color:#0b1020}}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip.ne{background:var(--warnbg);color:var(--warn);font-weight:700}
.nebox{background:var(--warnbg);color:var(--warn);font-weight:800;font-size:1.4rem;text-align:center;border-radius:12px;padding:20px}
.spbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.save{margin-top:14px;border:1px solid var(--ok);background:var(--okbg);border-radius:12px;padding:12px 14px}
.save .kv{border-bottom:1px dashed var(--border)}
.saveTot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-weight:800;font-size:1.25rem;color:var(--ok)}
.bkwrap{margin:0 0 20px}.bktitle{font-weight:700;margin:0 0 8px}
.bkgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.bkgrid{grid-template-columns:3fr 2fr}}
.bkben{border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:.88rem;align-self:start}
.bkben div{padding:8px 10px;border-bottom:1px solid var(--border)}.bkben div:last-child{border-bottom:0}.bkben .bkbh{background:var(--soft);font-weight:600}
.bk tr.tot td{font-weight:700;background:var(--soft);border-top:2px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
.yes{color:var(--ok);font-weight:700}.no{color:var(--no)}
.promo{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:12px;padding:16px}
.promo .big{font-size:1.6rem;font-weight:800;color:var(--accent);white-space:nowrap}
</style>
</head>

const group = i => i<=3 ? "pre" : i<=8 ? "primary" : "high";
const GROUP_LABEL = {pre:"Pre-Primary", primary:"Primary", high:"High School"};

// SRF / SD per round. r3 = Round-3 SRF by class group
const ROUNDS = [
  {key:"bkt", name:"MS Bachpan Ka Tohfa", from:"2026-11-14", to:"2027-01-09", fromTxt:"14 Nov 2026", toTxt:"9 Jan 2027",
   srf:{"A+":6000,"A":5000,"B":4000}, sd:0, form:200, reg:300,
   perks:{"Text Books":1,"Note Books":1,"Activity Material":1,"Regular Uniform (1 set)":1,"Regular Uniform Accessories":1,"White Uniform (1 set)":1,"White Uniform Accessories":1,"₹2,000 Rebate":0}},
  {key:"r1", name:"Round 1 – Early Advantage", from:"2027-01-11", to:"2027-04-10", fromTxt:"11 Jan 2027", toTxt:"10 Apr 2027",
   srf:{"A+":12000,"A":10000,"B":8000}, sd:5000, form:200, reg:500,
   perks:{"Text Books":1,"Note Books":1,"Activity Material":1,"Regular Uniform (1 set)":1,"Regular Uniform Accessories":1,"White Uniform (1 set)":0,"White Uniform Accessories":0,"₹2,000 Rebate":0}},
  {key:"r2", name:"Round 2 – Prime Advantage", from:"2027-04-12", to:"2027-05-31", fromTxt:"12 Apr 2027", toTxt:"31 May 2027",
   srf:{"A+":15000,"A":12000,"B":10000}, sd:5000, form:200, reg:500,
   perks:{"Text Books":0,"Note Books":0,"Activity Material":0,"Regular Uniform (1 set)":1,"Regular Uniform Accessories":1,"White Uniform (1 set)":0,"White Uniform Accessories":0,"₹2,000 Rebate":1}},
  {key:"r3", name:"Round 3 – Final Admission Phase", from:"2027-06-01", to:"2099-12-31", fromTxt:"1 Jun 2027", toTxt:"Till end",
   srf:null, r3:{"A+":{pre:20000,primary:25000,high:30000},"A":{pre:20000,primary:25000,high:30000},"B":{pre:15000,primary:20000,high:25000}},
   sd:5000, form:200, reg:500,
   perks:{"Text Books":0,"Note Books":0,"Activity Material":0,"Regular Uniform (1 set)":1,"Regular Uniform Accessories":1,"White Uniform (1 set)":1,"White Uniform Accessories":1,"₹2,000 Rebate":0}}
];

const SPECIAL = [
  {name:"Heavenly Hearts", srf:"₹5,000", srfFixed:5000, sd:"100% waived off", sdWaived:true,  pct:67,  free:[1,1,1]},
  {name:"MS Staff",        srf:"₹5,000", srfFixed:5000, sd:"100% waived off", sdWaived:true,  pct:50,  free:[0,0,0]},
  {name:"Ulema",           srf:"₹5,000", srfFixed:5000, sd:"₹5,000",          sdWaived:false, pct:50,  free:[0,0,0]},
  {name:"Hafiz",           srf:"Standard applicable", srfFixed:null, sd:"₹5,000", sdWaived:false, pct:25, free:[0,0,0]},
  {name:"3rd Child Onwards", srf:"Standard applicable", srfFixed:null, sd:"₹5,000", sdWaived:false, pct:25, free:[0,0,0]},
  {name:"Thalassemia",     srf:"₹5,000", srfFixed:5000, sd:"₹5,000",          sdWaived:false, pct:100, free:[0,0,0]}
];

/* ===== helpers ===== */
const $ = id => document.getElementById(id);
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const clsLabel = c => /^\d+$/.test(c) ? "Class " + c : c;
const tick = ok => ok ? '<span class="yes">✔</span>' : '';
const esc = s => String(s).replace(/</g,"&lt;");

Object.keys(BRANCHES).forEach(b => $("branch").add(new Option(b, b)));
CLASSES.forEach(c => $("cls").add(new Option(clsLabel(c), c)));
Object.keys(BRANCHES).forEach(b => $("otBranch").add(new Option(b, b)));
CLASSES.forEach(c => $("otCls").add(new Option(clsLabel(c), c)));
Object.keys(BRANCHES).forEach(b => $("exBranch").add(new Option(b, b)));
CLASSES.forEach(c => $("exCls").add(new Option(clsLabel(c), c)));
Object.keys(BRANCHES).forEach(b => $("spBranch").add(new Option(b, b)));
CLASSES.forEach(c => $("spCls").add(new Option(clsLabel(c), c)));
ROUNDS.forEach(r => $("round").add(new Option(`${r.name} (${r.fromTxt} – ${r.toTxt})`, r.key)));
function syncRounds(idx){
  if(group(idx) !== "pre" && $("round").value === "") $("round").value = "r1";
}

function negotiableNote(cat){
  return cat === "B"
    ? "SRF is negotiable at the Principal’s desk in consultation with the Branch Director in all rounds."
    : "Benefits under MS Bachpan Ka Tohfa are non-negotiable. From Round 1 onwards, SRF is negotiable at the Principal’s desk in consultation with the Branch Director.";
}

function renderNew(cat, idx, rkey, fee, sp){
  const g = group(idx), today = new Date().toISOString().slice(0,10);
  if(!rkey){ $("p-new").innerHTML = '<p class="muted">Select an admission round above to see the seat reservation fee, security deposit and total saving for this branch and class.</p>'; return; }
  const r = ROUNDS.find(x => x.key === rkey);
  const srfOf = (rr, x) => { const b = rr.srf ? rr.srf[cat] : rr.r3[cat][g]; return x && x.srfFixed != null ? Math.min(b, x.srfFixed) : b; };
  const sdOf = (rr, x) => x && x.sdWaived ? 0 : rr.sd;
  const std = ROUNDS[3];
  const stdTotal = srfOf(std, null) + sdOf(std, null) + std.form + std.reg;
  const srf = srfOf(r, sp), sd = sdOf(r, sp), total = srf + sd + r.form + r.reg;
  const admSave = Math.max(0, stdTotal - total);
  const tuiSave = sp ? fee - fee * (100 - sp.pct) / 100 : 0;
  const totalSave = admSave + tuiSave;
  const live = today >= r.from && today <= r.to;
  let h = `<div class="note">${negotiableNote(cat)}</div>`;
  if(sp) h += `<div class="spbox"><b>Special category: ${esc(sp.name)}</b> – ${sp.pct}% scholarship on tuition · SRF: ${sp.srf} · Security deposit: ${sp.sd}</div>`;
  h += `<div class="round ${live?"live":""}">
      <div class="t">${r.name}${live?'<span class="live-tag">RUNNING NOW</span>':""}</div>
      <div class="d">${r.fromTxt} – ${r.toTxt}${r.srf===null?` · ${GROUP_LABEL[g]} rate`:""}</div>
      <div class="kv"><span>Application form</span><b>${inr(r.form)}</b></div>
      <div class="kv"><span>Registration fee</span><b>${inr(r.reg)}</b></div>
      <div class="kv"><span>Security Deposit (SD)</span><b>${inr(sd)}</b></div>
      <div class="kv"><span>Seat Reservation Fee (SRF)</span><b>${inr(srf)}</b></div>
      <div class="kv"><span><b>Total payable at admission</b></span><b>${inr(total)}</b></div>
    </div>
    <h3 style="margin:16px 0 8px">Actual total charges <span class="muted">(${GROUP_LABEL[g]} · Category ${cat})</span></h3>
    <div class="scroll"><table class="bk"><thead><tr><th>Particular</th><th>Total</th></tr></thead><tbody>
      <tr><td>Application Form</td><td>${inr(std.form)}</td></tr>
      <tr><td>Registration</td><td>${inr(std.reg)}</td></tr>
      <tr><td>SD</td><td>${inr(sdOf(std,null))}</td></tr>
      <tr><td>SRF</td><td>${inr(srfOf(std,null))}</td></tr>
      <tr class="tot"><td>Total</td><td>${inr(stdTotal)}</td></tr></tbody></table></div>
    <div class="save">
      <div class="kv"><span>Actual total charges</span><b>${inr(stdTotal)}</b></div>
      <div class="kv"><span>Total fees – ${r.name}</span><b>− ${inr(total)}</b></div>
      <div class="kv"><span>Admission group concession (Actual total − Total fees)</span><b>${inr(admSave)}</b></div>
      ${sp ? `<div class="kv"><span>Tuition concession (${sp.pct}% of ${inr(fee)})</span><b>${inr(tuiSave)}</b></div>` : ""}
      <div class="saveTot"><span>Total saving</span><span>${inr(totalSave)}</span></div>
    </div>
    <p class="muted" style="margin-top:12px">Round 3 rates: Pre-Primary / Primary / High School (grouped here as Class 1–5 = Primary, Class 6–10 = High School).</p>`;
  $("p-new").innerHTML = h;
}


const notEligible = sp => `<div class="nebox">Not Eligible</div><p class="muted" style="margin-top:10px;text-align:center">Special category students (${esc(sp.name)}) are considered under their special category only – no additional scheme benefits.</p>`;
function renderFirst(sp){
  const rows = [["Text Book Free",0],["Note Book Free",0],["Activity Material Free",0],["Regular Uniform at 50%",1],["Regular Uniform Accessories at 50%",1],["White Uniform Free",0],["White Uniform Accessories Free",0],["Rebate of ₹400",0]];
  $("p-first").innerHTML = `<h3>First-Month Scheme (monthly payment) – promoting / new students</h3>
  <p class="muted">Applicable if paid on or before <b>8 June 2027</b> (Hyderabad).</p>
  <div class="scroll"><table><tbody>${rows.filter(r=>r[1]).map(r=>`<tr><td>${r[0]}</td><td>${tick(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
}

function renderB1G5(sp){
  if(sp){ $("p-b1g5").innerHTML = notEligible(sp); return; }
  const cases = [
    ["#1","General Category","General Category (2nd Child - Same father)","Only one child (New admission) will get benefit of ₹5,000 Scholarship."],
    ["#2","General Category","Special Category (3rd Child onwards - Same father)","3rd Child onwards benefits only. No benefit to general category student."],
    ["#3","General Category","Special Category","Special category student will be considered under special category only. No benefit to general category student."],
    ["#4","Special Category","General Category","Special category student will be considered under special category only &amp; general category student will be eligible for ₹5,000 scholarship."],
    ["#5","Special Category","Special Category","Both students will be considered under Special category only. No additional benefits."]
  ];
  $("p-b1g5").innerHTML = `<h3>B1G5000 (2027_28)</h3>
  <div class="promo"><div class="big">B1G5000</div><div><b>Scholarship – Bring 1 New Admission, Get ₹5,000!</b><div class="muted">Scholarship adjusted against Tuition Fee 2027_28.</div></div></div>
  <div class="b1" style="margin-top:14px"><table><thead><tr><th>Case</th><th>Promoting Student (2026_27)</th><th>New Admission (2027_28) Referred</th><th>Benefit (Scholarship adjusted against Tuition Fee 2027_28)</th></tr></thead><tbody>
  ${cases.map(c => `<tr><td data-label="Case"><b>${c[0]}</b></td><td data-label="Promoting Student (2026_27)">${c[1]}</td><td data-label="New Admission (2027_28) Referred">${c[2]}</td><td data-label="Benefit">${c[3]}</td></tr>`).join("")}</tbody></table></div>
  <div class="note" style="margin-top:14px;margin-bottom:0;text-align:center;font-weight:600">Parents paying OTP &amp; also bringing new admission, have to choose between OTP benefits or B1G5000 benefits.</div>`;
}

let specSel = "", specFee = null;
const SPEC_DOC = {
  "Heavenly Hearts": "Father’s death certificate",
  "MS Staff": "Confirmation from HR",
  "Ulema": "Sanad certificate from DRT",
  "Hafiz": "Sanad certificate from DRT",
  "3rd Child Onwards": "Applicable only if the elder siblings are actively enrolled in the school; benefit restricted to the youngest children only",
  "Thalassemia": "Medical certificate"
};
function renderSpecial(fee){
  if(fee !== undefined) specFee = fee;
  const has = specFee != null;
  const pills = SPECIAL.map(x => [x.name, x.name]).map(([label,val]) =>
    `<button type="button" class="spill" data-s="${esc(val)}" aria-pressed="${val === specSel}">${esc(label)}</button>`).join("");
  let body;
  if(!specSel){
    body = `<p class="muted" style="margin:0">Select a special category above to see its details.</p>`;
  } else {
    const x = SPECIAL.find(y => y.name === specSel), net = has ? specFee*(100-x.pct)/100 : 0;
    body = `<h3>${x.name}</h3>
      <div class="kv"><span>Seat Reservation Fee (SRF)</span><b>${x.srf}</b></div>
      <div class="kv"><span>Security deposit</span><b>${x.sd}</b></div>
      <div class="kv"><span>Scholarship on tuition fee</span><b>${x.pct}%</b></div>
      ${has ? `<div class="kv"><span>Tuition after concession</span><b>${inr(net)}</b></div><div class="kv"><span>Monthly installment (10)</span><b>${x.pct===100?"–":inr(net/10)}</b></div>` : ""}
      <div class="kv"><span>Free uniform &amp; books</span><b>${x.free[0] ? "Regular uniform, white uniform &amp; books" : "None"}</b></div>
      <div class="kv"><span>Document / condition</span><b style="text-align:right;max-width:60%">${SPEC_DOC[x.name]}</b></div>`;
  }
  $("p-special").innerHTML = `<h2>Special categories</h2>
    <div class="spills">${pills}</div>${body}
    <p class="muted" style="margin-top:12px">${has ? `Tuition after concession is calculated on the ${inr(specFee)} tuition fee of the class selected in New Admissions.` : "Select a branch and class in New Admissions to also see tuition after concession and the monthly amount."}</p>`;
}
$("p-special").addEventListener("click", e => {
  const t = e.target.closest(".spill"); if(!t) return;
  specSel = t.dataset.s; renderSpecial();
});
renderSpecial(null);

function render(){
  const b = $("branch").value, c = $("cls").value;
  if(!b || !c){ $("result").classList.add("hidden"); renderSpecial(null); return; }
  const cat = BRANCHES[b], idx = CLASSES.indexOf(c), fee = FEES[cat][idx];
  const sp = null;
  const net = sp ? fee * (100 - sp.pct) / 100 : fee;
  $("rBranch").textContent = b;
  $("rCat").textContent = "Category " + cat;
  $("rClass").textContent = clsLabel(c);
  $("sched").innerHTML = `<div class="inst" style="max-width:360px;padding:14px 16px"><span>Monthly installment × 10 months</span><b style="font-size:1.8rem;margin:2px 0">${inr(net/10)}</b><span>Due on the 8th of each month · ${DUE[0]} to ${DUE[DUE.length-1]}</span></div>`;
  syncRounds(idx); renderNew(cat, idx, $("round").value, fee, sp); renderFirst(sp); renderB1G5(sp); renderSpecial(fee, sp);
  $("result").classList.toggle("hidden", $("finderCard").classList.contains("hidden"));
}
$("branch").addEventListener("change", render);
$("cls").addEventListener("change", render);
$("round").addEventListener("change", render);

/* ===== SRF Benefits & Guidelines screen ===== */
function fmtD(iso){ if(iso.startsWith("2099")) return "Till End"; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }
function perkLabel(k){ if(k.startsWith("₹")) return k; const one = k.includes("(1 set)"); return k.replace(" (1 set)","") + " Free" + (one ? " (1 Set)" : ""); }
function buildSrf(){
  const bn = $("otBranch").value, c = $("otCls").value, rk = $("srfRound").value;
  if(!bn || !c){ $("srfBody").innerHTML = '<div class="card"><p class="muted" style="margin:0">Select a branch and class to see the OTP benefits, fees and saving for each admission round.</p></div>'; return; }
  const cat = BRANCHES[bn], idx = CLASSES.indexOf(c), g = group(idx), classFee = FEES[cat][idx];
  const r3 = ROUNDS[3];
  const base = {"Application Form": r3.form, "Registration": r3.reg, "SD": r3.sd, "SRF": r3.r3[cat][g]};
  const keys = Object.keys(base);
  let h = `<div class="card"><div class="branch">${esc(bn)}</div><span class="badge">Category ${cat}</span><span class="badge">${clsLabel(c)}</span>
    <div class="note" style="margin-top:12px">${negotiableNote(cat)}</div>`;
  ROUNDS.filter(r => !rk || r.key === rk).forEach(r => {
    const cur = {"SRF": r.srf ? r.srf[cat] : r.r3[cat][g], "SD": r.sd, "Application Form": r.form, "Registration": r.reg};
    const tb = keys.reduce((a,k) => a + base[k], 0), tc = keys.reduce((a,k) => a + cur[k], 0);
    const perks = Object.entries(r.perks).filter(([k,v]) => v).map(([k]) => perkLabel(k));
    h += `<div class="bkwrap"><div class="bktitle">${r.name} : ${fmtD(r.from)} to ${fmtD(r.to)}</div>
      <div class="bkgrid"><div><div class="scroll"><table class="bk"><thead><tr><th>Particular</th><th>Total</th><th>Fees</th><th>Saving</th></tr></thead><tbody>
      ${keys.map(k => `<tr><td>${k}</td><td>${inr(base[k])}</td><td>${inr(cur[k])}</td><td>${inr(base[k]-cur[k])}</td></tr>`).join("")}
      <tr class="tot"><td>Total</td><td>${inr(tb)}</td><td>${inr(tc)}</td><td>${inr(tb-tc)}</td></tr></tbody></table></div>
      <div class="stats" style="grid-template-columns:1fr;margin-top:12px"><div class="stat"><div class="k">Annual tuition fee</div><div class="v">${inr(classFee)}</div><div class="n">AY 2027-28</div></div></div></div>
      <div class="bkben"><div class="bkbh">Benefits</div>${perks.length ? perks.map(p => `<div>${p}</div>`).join("") : '<div class="muted">No free items</div>'}</div></div></div>`;
  });
  h += `<p class="muted">Total = standard Round 3 (Final Admission Phase) rate for ${GROUP_LABEL[g]}; Fees = amount payable in that round; Saving = Total − Fees.</p></div>`;
  $("srfBody").innerHTML = h;
}
ROUNDS.forEach(r => $("srfRound").add(new Option(`${r.name} (${r.fromTxt} – ${r.toTxt})`, r.key)));
const BC = [["branch","cls"],["otBranch","otCls"],["exBranch","exCls"],["spBranch","spCls"]];
function renderExStats(){
  const b = $("exBranch").value, c = $("exCls").value;
  if(!b || !c){ $("exHead").classList.add("hidden"); $("exStats").classList.add("hidden"); return; }
  const cat = BRANCHES[b], fee = FEES[cat][CLASSES.indexOf(c)];
  $("exBn").textContent = b; $("exCat").textContent = "Category " + cat; $("exCl").textContent = clsLabel(c);
  $("exFee").textContent = inr(fee);
  $("exHead").classList.remove("hidden");
  $("exStats").classList.toggle("hidden", $("exFirst").getAttribute("aria-pressed") === "true");
}
BC.forEach(([bi,ci]) => [bi,ci].forEach(id => $(id).addEventListener("change", () => {
  BC.forEach(([b2,c2]) => { $(b2).value = $(bi).value; $(c2).value = $(ci).value; });
  render(); buildSrf(); renderExStats();
})));
$("srfRound").addEventListener("change", buildSrf);
buildSrf();
function buildGuide(){
  let h = "";
  h += `<div class="card"><h2>Guidelines &amp; Notes</h2>
    <ol class="gl" type="a">
      <li>Application Fee &amp; Registration Fee is one-time, non-refundable.</li>
      <li>Security Deposit is refundable at the time of leaving the school, subject to adjustment of dues &amp; penalties (if any).</li>
      <li>Seat Reservation Fee is non-adjustable or non-refundable.</li>
      <li>Complimentary items are scheme-specific and time-bound.</li>
      <li>If a student withdraws before completion of SA1, the cost of complimentary items will be recovered.</li>
      <li>Concession Policy
        <ol type="i">
          <li>Heavenly Hearts: Father’s death certificate</li>
          <li>Thalassemia: Medical certificate</li>
          <li>Staff: Confirmation from HR</li>
          <li>Ulema: Sanad certificate from DRT</li>
          <li>Hafiz: Sanad certificate from DRT</li>
          <li>3rd Child onwards: Applicable only if the elder siblings are actively enrolled in the school; the benefit is restricted to the youngest children only.</li>
        </ol></li>
      <li>Fee concessions and schemes are valid only for the academic year mentioned.</li>
      <li>Only one concession category is applicable per student. Multiple concessions cannot be combined.</li>
      <li>The management reserves the right to modify or withdraw schemes without prior notice.</li>
      <li>For any clarification, parents are requested to contact the school administration office.</li>
      <li>For the convenience of the parents, the fee structure is designed on a monthly basis.</li>
    </ol></div>`;
  $("guideView").innerHTML = h;
}
buildGuide();

/* ===== Existing Student screen ===== */
const EXIST = {
  r1: {title:"Round 1", sub:"Last day 31 May 2027", rows:[["Text Book Free",1],["Note Book Free",1],["Activity Material Free",1],["Regular Uniform Free",1],["Regular Uniform Accessories Free",1],["White Uniform Free",0],["White Uniform Accessories Free",0]]},
  r2: {title:"Round 2", sub:"1 Jun 2027 to 14 Jun 2027", rows:[["Text Book Free",0],["Note Book Free",0],["Activity Material Free",0],["Regular Uniform Free",1],["Regular Uniform Accessories Free",1],["White Uniform Free",1],["White Uniform Accessories Free",1]]},
  fm: {title:"First-Month Scheme (Monthly Payment)", sub:"On or before 08 Jun 2027", rows:[["Text Book Free",0],["Note Book Free",0],["Activity Material Free",0],["Regular Uniform at 50%",1],["Regular Uniform Accessories at 50%",1],["White Uniform Free",0],["White Uniform Accessories Free",0]]}
};
function renderExist(){
  renderExStats();
  const fm = $("exFirst").getAttribute("aria-pressed") === "true";
  const key = fm ? "fm" : $("exRound").value;
  if(!key){ $("exBody").innerHTML = '<p class="muted" style="margin:0">Select a round, or tap “First-Month Scheme”, to see the benefits for existing students.</p>'; return; }
  const d = EXIST[key];
  $("exBody").innerHTML = `<h2>${d.title}</h2>
    <p class="muted" style="margin:-6px 0 12px">${d.sub} (Hyderabad time) · For existing / promoting students</p>
    <div class="scroll"><table><thead><tr><th>Scheme Period</th><th style="text-align:right">Benefits</th></tr></thead><tbody>
    ${d.rows.filter(r => r[1]).map(r => `<tr><td>${r[0]}</td><td style="text-align:right">${tick(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
}
$("exRound").addEventListener("change", () => { $("exFirst").setAttribute("aria-pressed", "false"); renderExist(); });
$("exFirst").addEventListener("click", () => {
  const on = $("exFirst").getAttribute("aria-pressed") !== "true";
  $("exFirst").setAttribute("aria-pressed", on);
  if(on) $("exRound").value = "";
  renderExist();
});
renderExist();
$("views").addEventListener("click", e => {
  const t = e.target.closest(".vtab"); if(!t) return;
  document.querySelectorAll(".vtab").forEach(x => x.setAttribute("aria-selected", x === t));
  const v = t.dataset.v;
  $("finderCard").classList.toggle("hidden", v !== "finder");
  $("srfView").classList.toggle("hidden", v !== "srf");
  $("guideView").classList.toggle("hidden", v !== "guide");
  $("existView").classList.toggle("hidden", v !== "existing");
  $("specView").classList.toggle("hidden", v !== "special");
  if(v === "finder") render(); else $("result").classList.add("hidden");
});
$("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x===t));
  ["new","first","b1g5"].forEach(k => $("p-"+k).classList.toggle("hidden", k !== t.dataset.t));
  $("schedCard").classList.toggle("hidden", t.dataset.t !== "new");
});
</script>
</body>
